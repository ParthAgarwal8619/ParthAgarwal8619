name: 📊 Update GitHub Analytics
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-analytics.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📊 Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=ParthAgarwal8619&
            show_icons=true&
            theme=dark&
            bg_color=0D1117&
            hide_border=true&
            include_all_commits=true&
            count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💻 Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=ParthAgarwal8619&
            layout=compact&
            theme=dark&
            bg_color=0D1117&
            hide_border=true&
            langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔥 Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=ParthAgarwal8619&
            theme=dark&
            hide_border=true&
            ring=58D6FF&
            fire=58D6FF&
            currStreakNum=58D6FF&
            sideNums=58D6FF&
            currStreakLabel=58D6FF&
            sideLabels=FFFFFF&
            dates=FFFFFF&
            disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 💾 Commit updated analytics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "📊 Update GitHub Analytics"
          git pull --rebase --autostash origin main
          git push
